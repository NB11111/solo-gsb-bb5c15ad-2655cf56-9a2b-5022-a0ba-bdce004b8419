<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>木工短料下料优化</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="no-print">
    <h1>木工短料下料优化</h1>
    <p class="subtitle">输入原料与裁片规格，自动计算用料根数最少的裁切方案（总裁片数上限 12 片）</p>
  </header>

  <main>
    <!-- 打印时显示的标题 -->
    <div class="print-only print-header">
      <h1>木工短料下料方案</h1>
      <p id="print-time"></p>
    </div>

    <section class="card no-print" id="input-card">
      <div class="base-fields">
        <label>
          原料长度
          <input type="number" id="stock-length" min="0" step="any" value="2440" />
        </label>
        <label>
          锯缝宽度
          <input type="number" id="kerf" min="0" step="any" value="3" />
        </label>
      </div>

      <h2>裁片规格</h2>
      <table class="spec-table">
        <thead>
          <tr>
            <th>规格</th>
            <th>长度</th>
            <th>数量</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="spec-rows"></tbody>
      </table>
      <div class="row-actions">
        <button type="button" id="add-row" class="btn btn-secondary">＋ 添加规格</button>
        <span id="piece-counter" class="piece-counter"></span>
      </div>

      <div id="form-error" class="error" hidden></div>

      <div class="actions">
        <button type="button" id="calc-btn" class="btn btn-primary">计算下料方案</button>
      </div>
      <p class="hint">说明：同规格会展开成单片（A1、A2…）参与计算；仅同一根原料上相邻的两片之间计一条锯缝；每根原料上的裁片按长度从大到小排列，即建议裁切顺序。</p>
    </section>

    <section id="result" hidden>
      <div class="card">
        <div class="result-head">
          <h2>计算结果</h2>
          <button type="button" id="print-btn" class="btn btn-secondary no-print">打印方案</button>
        </div>
        <div id="summary" class="summary"></div>
        <div id="bins"></div>
      </div>
    </section>
  </main>

  <footer class="no-print">
    <span>长度单位保持一致即可（如毫米）</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
